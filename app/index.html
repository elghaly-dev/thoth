  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script data-app-redirect>
      // /app/ on GitHub Pages is the Vite source entry. If React does
      // not mount (no TypeScript transform), send the visitor to the
      // built app at /use/. The built page sets data-mounted and stays.
      setTimeout(function () {
        if (!/^\/app(\/|$)/.test(location.pathname)) return;
        var root = document.getElementById('root');
        if (root && !root.getAttribute('data-mounted')) {
          window.location.replace('/use/');
        }
      }, 2000);
    </script>

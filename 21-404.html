<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thoth — पृष्ठ नहीं मिला</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#0b0c10; color:#e8e6e1; font-family: Georgia, serif; text-align:center; padding:24px; }
    a { color:#c9a227; }
    h1 { font-weight:500; letter-spacing:.06em; }
    .langswitch { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: .8rem; margin-bottom: 16px; }
    .langswitch button {
      background:none; border:1px solid rgba(201,162,39,.45); border-radius:999px;
      color:#e8e6e1; padding:6px 14px; margin:0 4px; cursor:pointer; min-height:36px;
    }
    .langswitch button[aria-pressed="true"] { background:#c9a227; color:#0b0c10; }
  </style>
</head>
<body>
  <main>
    <p><a href="https://elghaly.dev" dir="ltr" style="white-space:nowrap;unicode-bidi:isolate">by Elghaly LLC</a></p>
    <p class="langswitch" id="langswitch" aria-label="Language / भाषा / اللغة">
      <button type="button" data-lang="hi" aria-pressed="true">हिंदी</button>
      <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </p>
    <p>الخادم الأمين · Faithful Servant</p>
    <h1>Thoth</h1>
    <p data-i18n="notfound">यह पृष्ठ नहीं मिला।</p>
    <p><a href="/" data-i18n="home">होम</a> · <a href="/use/" data-i18n="open">Thoth खोलें</a></p>
    <p>Wyndham Heaven</p>
  </main>
  <script>
    (function () {
      var S = {
        hi: {
          dir: 'ltr', title: 'Thoth — पृष्ठ नहीं मिला',
          notfound: 'यह पृष्ठ नहीं मिला।', home: 'होम', open: 'Thoth खोलें'
        },
        ar: {
          dir: 'rtl', title: 'Thoth — الصفحة غير موجودة',
          notfound: 'هذه الصفحة غير موجودة.', home: 'الرئيسية', open: 'افتح Thoth'
        },
        en: {
          dir: 'ltr', title: 'Thoth — page not found',
          notfound: 'This page was not found.', home: 'Home', open: 'Open Thoth'
        }
      };
      var stored = null;
      try { stored = new URLSearchParams(location.search).get('lang') || localStorage.getItem('thoth-lang'); } catch (e) {}
      function apply(code) {
        var t = S[code];
        if (!t) { code = 'hi'; t = S.hi; }
        document.documentElement.lang = code;
        document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
        document.title = t.title;
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var j = 0; j < nodes.length; j++) {
          var k = nodes[j].getAttribute('data-i18n');
          if (t[k]) { nodes[j].textContent = t[k]; }
        }
        var btns = document.querySelectorAll('#langswitch button');
        for (var b = 0; b < btns.length; b++) {
          btns[b].setAttribute('aria-pressed', String(btns[b].getAttribute('data-lang') === code));
        }
        try { localStorage.setItem('thoth-lang', code); } catch (e) {}
      }
      document.getElementById('langswitch').addEventListener('click', function (ev) {
        var btn = ev.target.closest('button[data-lang]');
        if (btn) { apply(btn.getAttribute('data-lang')); }
      });
      apply(stored || 'hi');
    })();
  </script>
</body>
</html>

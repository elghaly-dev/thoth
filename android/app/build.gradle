plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.elghaly.thoth'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.elghaly.thoth'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        manifestPlaceholders = [
            hostName       : 'thoth.elghaly.dev',
            defaultUrl     : 'https://thoth.elghaly.dev/use/',
            themeColor     : '#0b0c10',
            backgroundColor: '#0b0c10',
        ]
    }

    // Upload-key signing, only when CI passes the key in through environment
    // variables (GitHub secrets set by the owner). Nothing about the key lives
    // in this repository; without the variables the release bundle is unsigned.
    def uploadStore = System.getenv('THOTH_UPLOAD_STORE_FILE')
    signingConfigs {
        if (uploadStore) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('THOTH_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('THOTH_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('THOTH_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (uploadStore) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity launcher (Google's android-browser-helper).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}

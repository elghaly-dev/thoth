<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thoth</title>
  <meta name="description" content="Thoth एक वॉइस-फर्स्ट बहुभाषी Faithful Servant है, जो निर्यातकों को विदेशी खरीदारों से उनकी अपनी भाषा में बात करने में मदद करता है।">
  <link rel="canonical" href="https://thoth.elghaly.dev/">
  <meta property="og:title" content="Thoth">
  <meta property="og:description" content="Thoth एक वॉइस-फर्स्ट बहुभाषी Faithful Servant है, जो निर्यातकों को विदेशी खरीदारों से उनकी अपनी भाषा में बात करने में मदद करता है।">
  <meta property="og:url" content="https://thoth.elghaly.dev/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Thoth">
  <meta name="twitter:description" content="Thoth एक वॉइस-फर्स्ट बहुभाषी Faithful Servant है, जो निर्यातकों को विदेशी खरीदारों से उनकी अपनी भाषा में बात करने में मदद करता है।">
  <meta property="og:image" content="https://thoth.elghaly.dev/og-image.png">
  <meta name="twitter:image" content="https://thoth.elghaly.dev/og-image.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0c10">
  <style>
    :root {
      --bg: #0b0c10;
      --text: #e8e6e1;
      --muted: #9a958c;
      --gold: #c9a227;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(201, 162, 39, 0.12), transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(201, 162, 39, 0.05), transparent 45%);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 24px 48px;
      max-width: 720px;
      margin: 0 auto;
    }
    .mark {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--gold);
      margin-bottom: 28px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 {
      font-weight: 500;
      font-size: clamp(3.2rem, 10vw, 5.4rem);
      letter-spacing: 0.06em;
      line-height: 1;
      margin-bottom: 24px;
    }
    .line {
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      line-height: 1.55;
      color: var(--muted);
      max-width: 28em;
      margin-bottom: 36px;
    }
    .badge {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid rgba(201, 162, 39, 0.45);
      border-radius: 999px;
      padding: 8px 18px;
      margin-bottom: 40px;
    }
    .cta-wrap { margin-bottom: 36px; }
    .cta {
      display: inline-block;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0b0c10;
      background: var(--gold);
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 28px;
      min-height: 44px;
      line-height: 20px;
    }
    .cta:hover, .cta:focus { outline: 2px solid #e8e6e1; outline-offset: 3px; }
    .credit {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .credit a { color: var(--gold); text-decoration: none; }
    .credit-bottom { margin: 0; }
    .langswitch {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      margin-bottom: 28px;
    }
    .langswitch button {
      background: none;
      border: 1px solid rgba(201, 162, 39, 0.45);
      border-radius: 999px;
      color: var(--text);
      padding: 6px 14px;
      margin: 0 4px;
      cursor: pointer;
      min-height: 36px;
    }
    .langswitch button[aria-pressed="true"] {
      background: var(--gold);
      color: #0b0c10;
    }
  </style>
</head>
<body>
  <main>
    <p class="credit"><a href="https://elghaly.dev">by Elghaly LLC</a></p>
    <p class="langswitch" id="langswitch" aria-label="Language / भाषा / اللغة">
      <button type="button" data-lang="hi" aria-pressed="true">हिंदी</button>
      <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </p>
    <p class="mark">الخادم الأمين · Faithful Servant</p>
    <h1>Thoth</h1>
    <p class="line" data-i18n="line">एक वॉइस-फर्स्ट बहुभाषी Faithful Servant, जो निर्यातकों को विदेशी खरीदारों से उनकी अपनी भाषा में बात करने में मदद करता है।</p>
    <p class="badge" data-i18n="badge">हर निर्यातक के लिए, छोटा या बड़ा</p>
    <p class="cta-wrap"><a class="cta" href="/use/" data-i18n="cta">Thoth खोलें</a></p>
    <p class="credit credit-bottom">Wyndham Heaven</p>
  </main>
  <script>
    (function () {
      var S = {
        hi: {
          dir: 'ltr',
          desc: 'Thoth एक वॉइस-फर्स्ट बहुभाषी Faithful Servant है, जो निर्यातकों को विदेशी खरीदारों से उनकी अपनी भाषा में बात करने में मदद करता है।',
          line: 'एक वॉइस-फर्स्ट बहुभाषी Faithful Servant, जो निर्यातकों को विदेशी खरीदारों से उनकी अपनी भाषा में बात करने में मदद करता है।',
          badge: 'हर निर्यातक के लिए, छोटा या बड़ा',
          cta: 'Thoth खोलें'
        },
        ar: {
          dir: 'rtl',
          desc: 'Thoth خادم أمين صوتي متعدد اللغات يساعد المصدّرين على التحدث مع المشترين في الخارج بلغتهم.',
          line: 'الخادم الأمين الصوتي متعدد اللغات الذي يساعد المصدّرين على التحدث مع المشترين في الخارج بلغتهم.',
          badge: 'لكل مصدّر، صغيرًا كان أم كبيرًا',
          cta: 'افتح Thoth'
        },
        en: {
          dir: 'ltr',
          desc: 'Thoth is a voice-first multilingual Faithful Servant that helps exporters talk to buyers abroad in their own language.',
          line: 'A voice-first multilingual Faithful Servant that helps exporters talk to buyers abroad in their own language.',
          badge: 'For every exporter, small or large',
          cta: 'Open Thoth'
        }
      };
      var stored = null;
      try { stored = new URLSearchParams(location.search).get('lang') || localStorage.getItem('thoth-lang'); } catch (e) {}
      function apply(code) {
        var t = S[code];
        if (!t) { code = 'hi'; t = S.hi; }
        document.documentElement.lang = code;
        document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
        var metas = document.querySelectorAll('meta[name="description"], meta[property="og:description"], meta[name="twitter:description"]');
        for (var i = 0; i < metas.length; i++) { metas[i].setAttribute('content', t.desc); }
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var j = 0; j < nodes.length; j++) {
          var k = nodes[j].getAttribute('data-i18n');
          if (t[k]) { nodes[j].textContent = t[k]; }
        }
        var btns = document.querySelectorAll('#langswitch button');
        for (var b = 0; b < btns.length; b++) {
          btns[b].setAttribute('aria-pressed', String(btns[b].getAttribute('data-lang') === code));
        }
        try { localStorage.setItem('thoth-lang', code); } catch (e) {}
      }
      document.getElementById('langswitch').addEventListener('click', function (ev) {
        var btn = ev.target.closest('button[data-lang]');
        if (btn) { apply(btn.getAttribute('data-lang')); }
      });
      apply(stored || 'hi');
    })();
  </script>
</body>
</html>

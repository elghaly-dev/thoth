# Hathor marketplace front end (hathor/): type check, wording, masking, fees,
# number-lock and i18n tests, then a production build. The token can read the repo and nothing more.
name: hathor-checks
on:
  push:
    branches: [main]
    paths: ["hathor/**", ".github/workflows/hathor-checks.yml"]
  pull_request:
    paths: ["hathor/**", ".github/workflows/hathor-checks.yml"]

permissions:
  contents: read

jobs:
  hathor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hathor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hathor/package-lock.json
      - run: npm ci
      - name: Dependency check (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

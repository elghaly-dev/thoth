name: android-twa
on:
  pull_request:
    paths: ["android/**", "twa-manifest.json", "app/public/**", ".well-known/**", "tools/check-twa.mjs", "tools/set-assetlinks.mjs", ".github/workflows/android-twa.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/check-twa.mjs

  build-unsigned-aab:
    # Unsigned release bundle only: no keystore, no secrets, nothing published.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build unsigned AAB
        run: gradle -p android bundleRelease --no-daemon
      - name: Print SDK levels (build.gradle and the merged release manifest)
        run: |
          set -euo pipefail
          grep -nE 'compileSdk|targetSdk|minSdk' android/app/build.gradle
          M=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -1)
          test -n "$M"
          echo "merged manifest: $M"
          grep -oE 'android:(minSdkVersion|targetSdkVersion|compileSdkVersion)="[0-9]+"' "$M"
          grep -q 'android:targetSdkVersion="35"' "$M" || { echo "::error::targetSdkVersion is not 35"; exit 1; }
      - name: Check it is unsigned; size and sha256
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          if jarsigner -verify "$AAB" | grep -q 'jar verified'; then echo "::error::AAB is signed; this job must stay unsigned"; exit 1; fi
          echo "AAB size: $(stat -c%s "$AAB") bytes"
          sha256sum "$AAB" | tee "$AAB.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: thoth-unsigned-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          retention-days: 14

  signed-release-aab:
    # Manual only (Actions > android-twa > Run workflow). Signs with the UPLOAD
    # key from repository secrets the owner sets; Play App Signing re-signs it.
    # The keystore is written to the runner's temp folder and deleted at the end.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      HAVE_KEY: ${{ secrets.THOTH_UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - name: Stop if the owner has not set the signing secrets
        if: env.HAVE_KEY != 'true'
        run: |
          echo "::error::Secrets THOTH_UPLOAD_KEYSTORE_B64, THOTH_UPLOAD_STORE_PASSWORD, THOTH_UPLOAD_KEY_ALIAS, THOTH_UPLOAD_KEY_PASSWORD are not set"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Write the upload keystore to the runner temp folder
        env:
          KS_B64: ${{ secrets.THOTH_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "THOTH_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed AAB
        env:
          THOTH_UPLOAD_STORE_PASSWORD: ${{ secrets.THOTH_UPLOAD_STORE_PASSWORD }}
          THOTH_UPLOAD_KEY_ALIAS: ${{ secrets.THOTH_UPLOAD_KEY_ALIAS }}
          THOTH_UPLOAD_KEY_PASSWORD: ${{ secrets.THOTH_UPLOAD_KEY_PASSWORD }}
        run: gradle -p android bundleRelease --no-daemon
      - name: Verify signature; print the upload certificate SHA-256 (public), size, sha256
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -q 'jar verified' || { echo "::error::AAB is not signed"; exit 1; }
          keytool -printcert -jarfile "$AAB" | grep -E 'SHA256:' | sed 's/^ */upload certificate /'
          echo "AAB size: $(stat -c%s "$AAB") bytes"
          sha256sum "$AAB" | tee "$AAB.sha256"
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: thoth-signed-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          retention-days: 7

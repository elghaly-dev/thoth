name: app-checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:zh
      - run: npm run test:nofree
      - run: npm run test:locales
      - run: npm run test:server
      - run: npm run test:mic
      - run: npm run test:ondevice   # on-device model: manifest, sha256 download checks, CSP, prompts (mock model)
      - run: npm test            # smoke, idle session, no-secrets, pages redirect
      - name: Build the Pages bundle (use/)
        run: npm run build:pages
      - name: Built use/ must be committed and reproducible (tracked and untracked)
        working-directory: .
        run: |
          git diff --exit-code -- use
          test -z "$(git status --porcelain --untracked-files=all -- use)" || { git status --porcelain -- use; exit 1; }
      - run: npm run test:site   # no "free", no "elghaly" credit, no "AI" on any served page

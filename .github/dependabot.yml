# Security and version updates arrive as PRs and go through the same review and CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thoth</title>
  <meta name="description" content="Thoth is a voice-first multilingual Faithful Servant that helps exporters talk to buyers abroad in their own language.">
  <link rel="canonical" href="https://thoth.elghaly.dev/">
  <meta property="og:title" content="Thoth">
  <meta property="og:description" content="Thoth is a voice-first multilingual Faithful Servant that helps exporters talk to buyers abroad in their own language.">
  <meta property="og:url" content="https://thoth.elghaly.dev/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Thoth">
  <meta name="twitter:description" content="Thoth is a voice-first multilingual Faithful Servant that helps exporters talk to buyers abroad in their own language.">
  <meta property="og:image" content="https://thoth.elghaly.dev/og-image.png">
  <meta name="twitter:image" content="https://thoth.elghaly.dev/og-image.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0c10">
  <style>
    :root {
      --bg: #0b0c10;
      --text: #e8e6e1;
      --muted: #9a958c;
      --gold: #c9a227;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(201, 162, 39, 0.12), transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(201, 162, 39, 0.05), transparent 45%);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 24px 48px;
      max-width: 720px;
      margin: 0 auto;
    }
    .mark {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--gold);
      margin-bottom: 28px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 {
      font-weight: 500;
      font-size: clamp(3.2rem, 10vw, 5.4rem);
      letter-spacing: 0.06em;
      line-height: 1;
      margin-bottom: 24px;
    }
    .line {
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      line-height: 1.55;
      color: var(--muted);
      max-width: 28em;
      margin-bottom: 36px;
    }
    .badge {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid rgba(201, 162, 39, 0.45);
      border-radius: 999px;
      padding: 8px 18px;
      margin-bottom: 40px;
    }
    .cta-wrap { margin-bottom: 36px; }
    .cta {
      display: inline-block;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0b0c10;
      background: var(--gold);
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 28px;
      min-height: 44px;
      line-height: 20px;
    }
    .cta:hover, .cta:focus { outline: 2px solid #e8e6e1; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="mark">الخادم الأمين · Faithful Servant</p>
    <h1>Thoth</h1>
    <p class="line">A voice-first multilingual Faithful Servant that helps exporters talk to buyers abroad in their own language.</p>
    <p class="badge">For every exporter, small or large</p>
    <p class="cta-wrap"><a class="cta" href="/use/">Open Thoth</a></p>
  </main>
</body>
</html>

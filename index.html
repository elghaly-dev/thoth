<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thoth</title>
  <meta name="description" content="Thoth is a free, voice-first multilingual Faithful Servant by Wyndham Heaven that helps exporters talk to buyers abroad in their own language.">
  <link rel="canonical" href="https://thoth.elghaly.dev/">
  <meta property="og:title" content="Thoth">
  <meta property="og:description" content="Thoth is a free, voice-first multilingual Faithful Servant by Wyndham Heaven that helps exporters talk to buyers abroad in their own language.">
  <meta property="og:url" content="https://thoth.elghaly.dev/">
  <meta name="twitter:card" content="summary">
  <style>
    :root {
      --bg: #0b0c10;
      --text: #e8e6e1;
      --muted: #9a958c;
      --gold: #c9a227;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(201, 162, 39, 0.12), transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(201, 162, 39, 0.05), transparent 45%);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 24px 48px;
      max-width: 720px;
      margin: 0 auto;
    }
    .mark {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--gold);
      margin-bottom: 28px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 {
      font-weight: 500;
      font-size: clamp(3.2rem, 10vw, 5.4rem);
      letter-spacing: 0.06em;
      line-height: 1;
      margin-bottom: 24px;
    }
    .line {
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      line-height: 1.55;
      color: var(--muted);
      max-width: 28em;
      margin-bottom: 36px;
    }
    .free {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid rgba(201, 162, 39, 0.45);
      border-radius: 999px;
      padding: 8px 18px;
      margin-bottom: 40px;
    }
    .by {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .by a { color: var(--gold); text-decoration: none; }
    .by a:hover { text-decoration: underline; }
    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 0.8rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p class="mark">الخادم الأمين · Faithful Servant</p>
    <h1>Thoth</h1>
    <p class="line">A free, voice-first multilingual Faithful Servant that helps exporters talk to buyers abroad in their own language.</p>
    <p class="free">Free for every exporter</p>
    <p class="by">by <a href="https://elghaly.dev">elghaly</a></p>
  </main>
  <footer>elghaly</footer>
</body>
</html>
